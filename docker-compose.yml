version: '3.8'
services:
  app:
    build:
      context: .
    ports:
      - "8443:8443"
    volumes:
      - ./src:/code
      - ./.env:/.env

    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8443", "--reload" ]

  test_db:
    image: mongo:latest
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-test-data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongo-data:
  mongo-test-data:
  redis_data:
