version: '3.8'
services:
  app:
    build:
      context: .
    ports:
      - "8443:8443"
    volumes:
      - ./src:/code:delegated
      - ./.env:/code/.env:ro
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8443 --reload

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:
