version: '3.8'
services:
  app:
    build:
      context: .
    ports:
      - "8443:8443"
    volumes:
      - ./src:/code:delegated
      - ./.env:/code/.env:ro
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017
    command: uvicorn main:app --host 0.0.0.0 --port 8443 --reload

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
