version: "3.9"

services:
  app:
    build:
      context: .
    ports:
      - "8443:8443"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./poetry.lock:/app/poetry.lock
      - ./.env:/app/.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8443", "--reload"]
