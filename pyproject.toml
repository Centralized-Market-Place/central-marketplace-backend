[tool.poetry]
name = "centeral-marketplace"
version = "0.1.0"
description = "centeral market-place backend"
authors = ["sahib-sem <semahegnsahib@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = {extras = ["standard"], version = "^0.115.8"}
motor = "^3.6.0"
pydantic = "^2.10.3"
ulid-py = "^1.1.0"
cattrs = "^24.1.2"
email-validator = "^2.2.0"
pydantic-settings = "^2.7.0"
injector = "^0.22.0"
fastapi-injector = "^0.6.2"
python-dateutil = "^2.9.0.post0"
pyjwt = "^2.10.1"
passlib = "^1.7.4"
bcrypt = "^4.2.1"
cryptography = "^44.0.0"
ulid = "^1.1"
ruff = "^0.9.4"
cloudinary = "^1.44.0"
sib-api-v3-sdk = "^7.6.0"


[tool.poetry.group.dev.dependencies]
pyhamcrest = "^2.1.0"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
